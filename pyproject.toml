[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-intelligence"
version = "0.1.0"
description = "Advanced forecasting, anomaly detection and time-series evaluation toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "typer>=0.12", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
torch = ["torch>=2.2"]

[project.scripts]
ts-intel = "ts_intel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
